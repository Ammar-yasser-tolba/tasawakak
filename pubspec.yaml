name: tasawakak
description: "Tasawakak — clothes & watches. A premium light-theme authentication experience."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#F7F5F0"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#F7F5F0"
    theme_color: "#16243C"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/splash/extracted_icon.png
    - assets/splash/extracted_text.png

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
